<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Blog</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>
<script src="common.js"></script>

</head>

<body>

<nav class="navbar">

<div class="logo">
    MyBlog
</div>

<div class="nav-links">

<a href="index.html">Home</a>
<a href="users.html">Users</a>
<a href="public-chat.html">Public Chat</a>
<a href="create-post.html">Write</a>
<a href="profile.html">Profile</a>
<a href="about.html">About</a>

</div>

</nav>

<main class="container">

<h1>Latest Posts</h1>

<div id="posts">
    Loading...
</div>

</main>

<footer class="footer">

<a href="about.html">About</a> |
<a href="contact.html">Contact</a> |
<a href="terms.html">Terms</a> |
<a href="privacy.html">Privacy</a>

</footer>

<script>

async function loadPosts() {

    const { data, error } =
        await supabaseClient
        .from("posts")
        .select(`
            id,
            title,
            content,
            created_at,
            author_id,
            profiles (
                username,
                display_name
            )
        `)
        .order("created_at", {
            ascending: false
        });

    const container =
        document.getElementById("posts");

    if (error) {

        container.innerHTML =
            `<div class="error">${escapeHTML(error.message)}</div>`;

        return;
    }

    if (!data.length) {

        container.innerHTML =
            "<p>No posts yet.</p>";

        return;
    }

    container.innerHTML = data.map(post => {

        const author =
            post.profiles?.display_name ||
            post.profiles?.username ||
            "Unknown";

        return `
        <article class="card">

            <h2 class="post-title">
                ${escapeHTML(post.title)}
            </h2>

            <div class="meta">
                By
                <a href="profile.html?id=${encodeURIComponent(post.author_id)}">
                    ${escapeHTML(author)}
                </a>
                ·
                ${escapeHTML(formatDate(post.created_at))}
            </div>

            <p class="post-content">
                ${escapeHTML(post.content)}
            </p>

        </article>
        `;

    }).join("");
}

loadPosts();

supabaseClient
.channel("posts-live")
.on(
    "postgres_changes",
    {
        event: "*",
        schema: "public",
        table: "posts"
    },
    () => {
        loadPosts();
    }
)
.subscribe();

</script>

</body>
</html>
